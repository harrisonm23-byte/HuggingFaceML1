# Tiny, fast run to check the pipeline end to end (runs on CPU in a few minutes).
name: rd1-smoke
seed: 42

model:
  name: distilbert-base-uncased
  num_labels: 2

data:
  dataset: stanfordnlp/imdb
  max_length: 128
  max_train_samples: 200
  max_eval_samples: 100

train:
  epochs: 1
  batch_size: 8
